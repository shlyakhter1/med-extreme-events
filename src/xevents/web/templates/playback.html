{% from "macros.html" import pair_script %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playback · med-extreme-events</title>
<link rel="stylesheet" href="/static/vendor/leaflet.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
<script src="/static/vendor/leaflet.js?v={{ asset_v }}"></script>
<script src="/static/vendor/htmx.min.js?v={{ asset_v }}"></script>
<script src="/static/map.js?v={{ asset_v }}"></script>
</head>
<body class="playback">
<div id="app">
  <header class="appbar">
    <a class="brand" href="/">med-extreme-events</a>
    <label class="grp"><span class="lbl">View</span> <select id="scenario"></select></label>
    <div class="grp transport">
      <button id="step-back" class="icon-btn" title="back one step (←)" aria-label="back one step">◀</button>
      <button id="play" class="primary" title="play / pause (Space)">▶ Play</button>
      <button id="step-fwd" class="icon-btn" title="forward one step (→)" aria-label="forward one step">▶</button>
    </div>
    <div class="clock-grp"><span class="clock" id="clock">—</span><span class="lbl" id="clock-note">UTC</span></div>
    <label class="grp"><span class="lbl">Step</span> <select id="speed">
      <option value="1">1 h</option><option value="3" selected>3 h</option>
      <option value="6">6 h</option><option value="12">12 h</option><option value="24">1 day</option>
    </select></label>
    <nav>
      <a id="nav-dashboard" href="/">Dashboard</a>
      <a id="nav-events" href="/dashboard/events">Events</a>
      <span class="on">Playback</span>
      <a href="/docs">API</a>
      <a href="/sources">Sources</a>
    </nav>
  </header>
  <div class="banner" id="banner">
    <span class="pill" id="mode-pill">Replay</span>
    <span id="banner-text"></span>
    <span id="status" class="aside mono faint" style="font-size:11px"></span>
  </div>
  <div id="pb-body" class="browse">
    <nav id="crumbs" class="crumbs" aria-label="selection"></nav>
    <div id="reading" aria-live="polite"></div>
    <div id="map-wrap">
      <div id="map"></div>
      <div id="hazards" class="map-pills" aria-label="active hazards"></div>
      <div id="map-legend" hidden></div>
      <div id="inset-label"></div>
      <button id="expand-map" type="button" title="Back to the full map (Esc)">expand map ⤢</button>
    </div>
    <aside id="side"><div class="empty">Loading…</div></aside>
  </div>
  <footer class="timeline">
    <div class="tl-bounds"><span class="b" id="t-start">—</span><span class="mid">one lane per product · bar = active window · click to jump</span><span class="b" id="t-end">—</span></div>
    <div id="timeline" role="group" aria-label="event timeline"></div>
  </footer>
</div>
<script src="/static/playback.js?v={{ asset_v }}"></script>
{{ pair_script() }}
</body>
</html>
