<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playback · med-extreme-events</title>
<link rel="stylesheet" href="/static/vendor/leaflet.css?v={{ asset_v }}">
<script src="/static/vendor/leaflet.js?v={{ asset_v }}"></script>
<script src="/static/map.js?v={{ asset_v }}"></script>
<style>
  :root { --bg:#0f1419; --panel:#161d26; --ink:#e6edf3; --muted:#8b98a5; --line:#2a3440; --accent:#4c8dff;
          --heat:#e4572e; --flood:#3d7fdc; --smoke:#8c6d3f; --air:#a05cd6; --outage:#d9a41a; --idle:#5b6673; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; overflow:hidden; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  #app { display:grid; grid-template-rows:auto 1fr auto; grid-template-columns:1fr 400px; height:100vh; }
  header { grid-column:1/3; display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:15px; margin:0 8px 0 0; font-weight:600; }
  select, button, input { background:#0f1419; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 9px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:#4c5d70; }
  button.primary { border-color:var(--accent); color:var(--accent); min-width:104px; }
  #map { grid-row:2; grid-column:1; }
  .leaflet-container { background:#0b1015; }
  .leaflet-tooltip { background:#161d26; border:1px solid var(--line); color:var(--ink); }
  aside { grid-row:2; grid-column:2; overflow:auto; border-left:1px solid var(--line); background:var(--panel); padding:12px 14px; }
  footer { grid-column:1/3; border-top:1px solid var(--line); background:var(--panel); padding:4px 14px 8px; }
  .muted { color:var(--muted); }
  .legend span.sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 4px 0 10px; vertical-align:-1px; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .row:hover { background:#1c2531; } .row.on { background:#1c2531; outline:1px solid #37506f; }
  .tag { font-size:11px; padding:1px 6px; border-radius:10px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .tag.sev-4 { border-color:#c0392b; color:#ff8a80; } .tag.sev-3 { border-color:#b9770e; color:#ffcf6b; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 6px; }
  h2:first-child { margin-top:0; }
  .card { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; }
  .card h3 { margin:0 0 4px; font-size:14px; }
  .card ul { margin:4px 0 0 18px; padding:0; } .card li { margin:2px 0; }
  .prov { font-size:12px; color:var(--muted); }
  .roles { display:inline-flex; gap:4px; margin:6px 0; }
  .roles button { padding:3px 8px; color:var(--muted); } .roles button.on { color:var(--ink); border-color:#4c5d70; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  .warn { background:#3a2a12; border:1px solid #6b4d1c; border-radius:6px; padding:6px 8px; font-size:12px; margin-top:8px; }
  #timeline { width:100%; display:block; user-select:none; cursor:crosshair; }
  #timeline text { font:10px system-ui, sans-serif; fill:#8b98a5; }
  #timeline .lane-label { font-size:10px; }
  #timeline rect.bar { cursor:pointer; }
  #timeline rect.bar:hover { stroke:#fff; stroke-width:1; }
  .clock { font-variant-numeric:tabular-nums; font-size:15px; font-weight:600; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>playback</h1>
    <label>Scenario <select id="scenario"></select></label>
    <button id="play" class="primary">▶ Play</button>
    <button id="step-back" title="back one step (←)">◀</button>
    <button id="step-fwd" title="forward one step (→)">▶</button>
    <label>Step <select id="speed">
      <option value="1">1 h</option><option value="3" selected>3 h</option>
      <option value="6">6 h</option><option value="12">12 h</option><option value="24">1 day</option>
    </select></label>
    <span class="clock" id="clock">—</span>
    <span class="legend muted">
      <span class="sw" style="background:var(--heat)"></span>heat
      <span class="sw" style="background:var(--flood)"></span>hurricane/flood
      <span class="sw" style="background:var(--smoke)"></span>smoke
      <span class="sw" style="background:var(--air)"></span>air
      <span class="sw" style="background:var(--idle)"></span>idle facility
    </span>
    <span style="margin-left:auto"><a href="/">← Dashboard</a> <span id="status" class="muted"></span></span>
  </header>
  <div id="map"></div>
  <aside id="side"><div class="muted">Loading…</div></aside>
  <footer>
    <div class="muted" style="display:flex; justify-content:space-between; font-size:12px; padding:2px 0">
      <span id="t-start">—</span>
      <span>Timeline — each bar is an event's active window (UTC). Click to jump; click a bar to inspect that event.</span>
      <span id="t-end">—</span>
    </div>
    <svg id="timeline" height="150" role="img" aria-label="event timeline"></svg>
  </footer>
</div>
<script src="/static/playback.js?v={{ asset_v }}"></script>
</body>
</html>
