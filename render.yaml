# Render blueprint — public replay demo, deployed from GitHub (see docs/deploy.md §3).
# One-time: Render dashboard → New → Blueprint → pick this repository → Apply.
# After that every push to main that passes the GitHub "ci" workflow (lint + tests)
# rebuilds and redeploys; a commit whose checks fail is never deployed.
services:
  - type: web
    name: med-extreme-events
    runtime: docker
    plan: free            # 512 MB; the app peaks around 225 MB. Sleeps when idle.
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: EVENT_MODE
        value: replay
      - key: DATABASE_URL
        value: sqlite:////app/demo.db   # baked into the image at build time
      - key: LIVE_REFRESH_MINUTES      # live events refresh at startup and hourly
        value: "60"
      - key: NWS_USER_AGENT
        value: med-extreme-events demo (https://github.com/shlyakhter1/med-extreme-events)
      - key: EAGLEI_FEATURE_URL        # public EAGLE-I state mirrors: Georgia (GEMA), Ohio
        value: >-
          https://services1.arcgis.com/2iUE8l8JKrP2tygQ/arcgis/rest/services/Join_Features_to_GEMA_All_Hazards_and_Master_Contacts_Layer_view/FeatureServer/0
          https://services6.arcgis.com/zxOMWqh0yAD6mMsJ/arcgis/rest/services/power_outages_eagle_i/FeatureServer/0
