# Fly.io deployment for the demo image (see docs/deploy.md).
# One-time: fly launch --no-deploy --copy-config   then:  fly deploy
app = "med-extreme-events"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite:////app/demo.db"
  EVENT_MODE = "replay"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
