# yaml-language-server: $schema=card.schema.json
# Transcribed from docs/card-library.md (clinical review 2026-09-23) — Card 7. Clinical strings
# are verbatim; do not edit in code. [SHARED] markers are library markup and are stripped.
# Triggers list the post-Oct-2024 NWS product names only; legacy names (Wind Chill …) are
# normalized in the NWS provider (SCN23-44), never here.
id: cold-cardio-respiratory
version: 1.1.0
number: 7
title: Extreme Cold / Winter Storm × Cardiovascular & Respiratory Disease
summary: >-
  Cold drives peripheral vasoconstriction, raising blood pressure and cardiac workload, and
  shifts hemostatic factors toward thrombosis — precipitating MI and stroke; cold, dry air
  triggers bronchospasm and worsens COPD/asthma.

event_triggers:
  - type: extreme_cold
    conditions:
      nws_events:
        - Extreme Cold Warning
        - Extreme Cold Watch
        - Cold Weather Advisory
        - Winter Storm Warning
        - Winter Storm Watch
        - Ice Storm Warning
        - Blizzard Warning

population_selector:
  condition_codes:
    - {system: icd10cm, code: I25, display: Chronic ischemic heart disease}
    - {system: icd10cm, code: I50, display: Heart failure}
    - {system: icd10cm, code: I10, display: Essential hypertension}
    - {system: icd10cm, code: Z86.73, display: Personal history of stroke/TIA}
    - {system: icd10cm, code: J44, display: Chronic obstructive pulmonary disease}
    - {system: icd10cm, code: J45, display: Asthma}
  flags:
    - age_65_plus
    - homeless_or_unstably_housed
    - home_oxygen_or_electricity_dependent_dme
    - prior_mi_stroke
    - outdoor_worker
  denominator_key: coronary_heart_disease
  denominator_note: >-
    Denominator anchors: CHD/COPD/asthma county rates from CDC PLACES × catchment veteran
    counts (existing M3 machinery); CHF ≈ 5% of VHA enrollees.
  sub_panels:
    - key: heart_failure
      label: Heart failure
      condition_codes:
        - {system: icd10cm, code: I50, display: Heart failure}
      denominator_key: heart_failure
    - key: copd
      label: COPD
      condition_codes:
        - {system: icd10cm, code: J44, display: Chronic obstructive pulmonary disease}
      denominator_key: copd
    - key: asthma
      label: Asthma
      condition_codes:
        - {system: icd10cm, code: J45, display: Asthma}
      denominator_key: asthma

actions:
  care_team:
    - phase: pre_event
      text: >-
        Rosters: cardiovascular and respiratory panels, flagging home-oxygen/DME, homeless,
        age ≥65, and insulin users.
    - phase: pre_event
      text: >-
        Verify heating adequacy and a warm-place plan; coordinate homeless-program outreach
        and warming centers with transportation.
    - phase: pre_event
      text: >-
        Counsel cardiac patients against strenuous cold exertion (snow shoveling); review
        inhaler supply and cold-air plans for asthma/COPD patients.
    - phase: pre_event
      text: >-
        Push CO-safety messaging; confirm oxygen backup where outages threaten (Card 6 DME
        sub-panel).
    - phase: during_event
      text: >-
        Wellness checks on flagged patients — isolation plus cold is the lethal combination;
        monitor for hypothermia and CO presentations; low threshold to relocate patients in
        unheated homes; when outages co-occur, the engine boost elevates these items — treat
        as a compounded emergency.
  patient:
    - text: Cold weather is hard on your heart and lungs.
    - text: >-
        Stay warm and dry, dress in layers, and avoid heavy outdoor work like shoveling snow —
        it strains the heart; take breaks or get help.
    - text: >-
        Cover your nose and mouth with a scarf so you breathe warmer air, and keep your rescue
        inhaler with you.
    - text: >-
        Never use a generator, grill, camp stove, or charcoal indoors or in a garage — even
        with the door open. Keep generators outside and away from windows. Use a
        battery-powered CO alarm.
    - text: >-
        If you use insulin, don't let it freeze — an unheated home or car can freeze it, and
        frozen insulin must be thrown away.
    - text: If your heat goes out, go somewhere warm and tell us.
    - text: Keep taking your medicines.
  caregiver: []

escalation:
  - signs: Chest pain or pressure; one-sided weakness or trouble speaking
    response: "911"
    emergency: true
  - signs: Severe shortness of breath or blue lips
    response: "911"
    emergency: true
  - signs: >-
      Confusion, intense shivering or shivering that stops, slurred speech (hypothermia)
    response: 911 and rewarm
    emergency: true
  - signs: Headache, dizziness, or nausea indoors while heating with fuel (possible CO)
    response: fresh air immediately and call
    emergency: false
  - signs: No heat at home during an Extreme Cold Warning
    response: same-day call
    emergency: false

evidence_tier: strong
evidence:
  mechanism: >-
    Cold drives peripheral vasoconstriction, raising blood pressure and cardiac workload, and
    shifts hemostatic factors toward thrombosis — precipitating MI and stroke; cold, dry air
    triggers bronchospasm and worsens COPD/asthma. Storm conditions add hypothermia risk and
    carbon-monoxide poisoning from improvised indoor heating.
  claims:
    - text: >-
        Cold drives peripheral vasoconstriction, raising blood pressure and cardiac workload,
        and shifts hemostatic factors toward thrombosis — precipitating MI and stroke; cold,
        dry air triggers bronchospasm and worsens COPD/asthma. Storm conditions add
        hypothermia risk and carbon-monoxide poisoning from improvised indoor heating.
      tier: strong
      source_ids: [gasparrini-2015]
    - text: >-
        Across 384 locations in 13 countries, 7.29% of deaths were attributable to cold versus
        0.42% to heat — with most of the cold burden from moderate cold, so risk is not
        confined to record-breaking days.
      tier: strong
      source_ids: [gasparrini-2015]
    - text: >-
        Winter Storm Uri (Texas, Feb 2021): 246 storm-related deaths; 161 (65.4%) from cold
        exposure, 158 of them hypothermia; 19 from carbon-monoxide poisoning.
      tier: strong
      source_ids: [texas-dshs-uri-2021]
    - text: >-
        Counsel cardiac patients against strenuous cold exertion (snow shoveling); review
        inhaler supply and cold-air plans for asthma/COPD patients.
      tier: expert_guidance
      source_ids: [aha-snow-shoveling, cdc-co-guidance]
  caveats:
    - >-
      Medication-specific cold interactions are weakly evidenced compared with heat; the only
      drug-level line is the insulin freeze rule (fda-insulin-emergency).
    - Cardiovascular cold-risk framing beyond the epidemiology is expert guidance.

sources:
  - id: gasparrini-2015
    citation: >-
      Gasparrini A et al. Mortality risk attributable to high and low ambient temperature: a
      multicountry observational study. Lancet 2015;386(9991):369–75.
    url: https://doi.org/10.1016/S0140-6736(14)62114-0
    year: 2015
    note: The mechanism claim cites it as context.
  - id: texas-dshs-uri-2021
    citation: Texas DSHS, February 2021 Winter Storm Related Deaths, final report (Dec 31, 2021)
    year: 2021
  - id: nws-scn23-44
    citation: NWS Service Change Notice 23-44 (updated Mar 26, 2024)
    year: 2024
    note: Source of the current product names listed in event_triggers.
  - id: cdc-co-guidance
    citation: CDC carbon monoxide poisoning prevention guidance
    note: URL pending.
  - id: aha-snow-shoveling
    citation: AHA advisory on snow shoveling and cardiac risk
    note: URL pending.
  - id: fda-insulin-emergency
    citation: >-
      FDA, "Information Regarding Insulin Storage and Switching Between Products in an
      Emergency" (content current as of 09/19/2017)
    url: https://www.fda.gov/drugs/emergency-preparedness-drugs/information-regarding-insulin-storage-and-switching-between-products-emergency

window_days: {min: 1, max: 3}
safety:
  do_not_stop_medication: false
  notes:
    - No medication classes are selected; the card's patient text still says to keep taking medicines.
acuity_class: cold_cardio_respiratory
care_system_hooks: [homeless_pact, clinical_contact_center, my_healthevet, empower]
