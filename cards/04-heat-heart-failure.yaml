# yaml-language-server: $schema=card.schema.json
# Transcribed from docs/card-library.md — Card 4. Clinical strings are verbatim; do not edit in code.
id: heat-heart-failure
version: 1.0.0
number: 4
title: Extreme Heat × Heart Failure on Diuretics / ACE-ARB-ARNI / Beta-blockers
summary: >-
  Heat-sensitizing cardiovascular drugs (loop/thiazide diuretics, ACE inhibitors, ARBs,
  ARNIs, beta-blockers) impair heat dissipation in heart-failure patients, precipitating
  hypotension, electrolyte derangement, AKI, and HF decompensation.

event_triggers:
  - type: heat
    conditions:
      nws_events:
        - Heat Advisory
        - Excessive Heat Warning
        - Extreme Heat Warning
  - type: heat
    conditions:
      heatrisk_min: orange

population_selector:
  condition_codes:
    - {system: icd10cm, code: I50, display: Heart failure}
  med_classes:
    - {system: atc, code: C03C, display: Loop diuretics}
    - {system: atc, code: C03A, display: Thiazide diuretics}
    - {system: atc, code: C09A, display: ACE inhibitors}
    - {system: atc, code: C09C, display: Angiotensin II receptor blockers (ARBs)}
    - {system: atc, code: C09DX04, display: Sacubitril and valsartan (ARNI)}
    - {system: atc, code: C07, display: Beta blocking agents}
  flags:
    - ace_arb_plus_diuretic
    - prior_aki
    - prior_hyponatremia
  denominator_key: heart_failure
  denominator_note: >-
    Denominator anchor: HF ≈ 5% of veterans in VA care (~510,000 VHA HF patients
    2016–2020); ACE/ARB/ARNI and beta-blocker prescribing each ~60–64% in VA HFrEF
    cohorts.

actions:
  care_team:
    - phase: pre_event
      text: >-
        Run the HF + heat-sensitizing-drug query; flag ACE/ARB + diuretic combos and prior
        AKI/hyponatremia.
    - phase: pre_event
      text: >-
        Pharmacist/clinician review of a "hot-day" plan: pre-specified parameters for
        temporary diuretic adjustment and fluid intake — never abrupt discontinuation
        without a plan.
    - phase: pre_event
      text: Confirm daily weights, BP checks, and a named check-in contact.
    - phase: pre_event
      text: >-
        Verify home cooling and that no medications sit in hot locations (cars, above the
        fridge).
    - phase: during_event
      text: >-
        Outreach calls/telehealth to the highest-risk cohort on HeatRisk orange/red/magenta
        days.
    - phase: during_event
      text: Reinforce the hot-day plan.
    - phase: during_event
      text: Watch orthostatic symptoms, weight change, urine output.
    - phase: during_event
      text: Expedite electrolyte/renal checks.
  patient:
    - text: >-
        Hot weather plus your heart and blood-pressure medicines can make you dehydrated,
        dizzy, or hurt your kidneys.
    - text: Stay cool.
    - text: Follow the fluid plan we gave you — don't guess.
    - text: Weigh yourself daily.
    - text: Don't stop any medicine on your own.
    - text: >-
        If you feel dizzy, very weak, confused, urinate much less, or gain weight fast,
        call us.
  caregiver: []

escalation:
  - signs: Weight gain >2–3 lb/day or >5 lb/week
    response: null
    emergency: false
  - signs: Worsening dyspnea or swelling
    response: null
    emergency: false
  - signs: BP drop with dizziness/fainting
    response: null
    emergency: false
  - signs: Reduced urine output or confusion
    response: null
    emergency: false
  - signs: Heat-exhaustion symptoms
    response: null
    emergency: false
  - signs: Syncope, chest pain, or altered mental status
    response: emergency
    emergency: true

evidence_tier: strong
evidence:
  mechanism: >-
    Heat causes dehydration, vasodilation, and neurohormonal activation; diuretics deplete
    volume and blunt thirst, ACE/ARBs reduce thirst and blood pressure, beta-blockers
    reduce cutaneous vasodilation and sweating — together impairing heat dissipation and
    precipitating hypotension, electrolyte derangement, AKI, and HF decompensation (CDC
    guidance).
  claims:
    - text: >-
        Medicare ≥65: heatwaves raised heat-related hospitalization 21% (95% CI 7–38%) to
        33% (95% CI 14–55%) across heat-sensitizing classes; loop diuretics specifically
        implicated in HF, dementia, and MI patients; effects additive, not synergistic.
      tier: strong
      source_ids: [layton-2020]
    - text: >-
        CDC: ACE/ARB + diuretic "may significantly increase risk of harm from heat
        exposure."
      tier: expert_guidance
      source_ids: [cdc-heat-medications-2024]
    - text: >-
        Extreme heat above the 97th–99th temperature percentiles is linked to roughly a
        10–15% rise in HF-related deaths.
      tier: inferential
      source_ids: [setoguchi-hennessy-2026]
  caveats:
    - >-
      Layton 2020 found drug and heatwave effects largely additive; avoid quoting a
      multiplicative OR for any single drug.
    - >-
      The CDC heat-and-medications page was archived in early 2025; citations reflect
      the June 2024 version — re-verify against the live page.

sources:
  - id: cdc-heat-medications-2024
    citation: CDC "Heat and Medications — Guidance for Clinicians" (2024)
    url: https://restoredcdc.org/www.cdc.gov/heat-health/hcp/clinical-guidance/heat-and-medications-guidance-for-clinicians.html
    year: 2024
  - id: layton-2020
    citation: Layton et al., PLOS One 2020
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7728169/
    year: 2020
  - id: setoguchi-hennessy-2026
    citation: Setoguchi & Hennessy, Pharmacoepidemiol Drug Saf 2026
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13427620/
    year: 2026
  - id: va-chf-prevalence
    citation: VA CHF prevalence (JAMA Network Open VA cohort)

window_days: {min: 3, max: 7}
safety:
  do_not_stop_medication: true
  notes:
    - Never abrupt discontinuation without a plan.
acuity_class: heart_failure
care_system_hooks: []
