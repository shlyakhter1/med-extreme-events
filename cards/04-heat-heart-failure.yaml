# yaml-language-server: $schema=card.schema.json
# Transcribed from docs/card-library.md (clinical review 2026-09-23) — Card 4. Clinical strings
# are verbatim; do not edit in code. [SHARED] markers are library markup and are stripped.
id: heat-heart-failure
version: 2.0.0
number: 4
title: Extreme Heat × Heart Failure on Diuretics / ACE-ARB-ARNI / Beta-blockers
summary: >-
  Diuretics deplete volume and electrolytes in heat; ACE inhibitors and ARBs can blunt
  thirst; beta-blockers limit the cardiac-output response to heat stress — CDC guidance flags
  the ACE/ARB + diuretic combination as one that may significantly increase heat risk.

event_triggers:
  - type: heat
    conditions:
      nws_events:
        - Heat Advisory
        - Excessive Heat Watch
        - Excessive Heat Warning
        - Extreme Heat Watch
        - Extreme Heat Warning
  - type: heat
    conditions:
      heatrisk_min: orange

population_selector:
  condition_codes:
    - {system: icd10cm, code: I50, display: Heart failure}
  med_classes:
    - {system: atc, code: C03C, display: Loop diuretics}
    - {system: atc, code: C03A, display: Thiazide diuretics}
    - {system: atc, code: C09A, display: ACE inhibitors}
    - {system: atc, code: C09C, display: Angiotensin II receptor blockers (ARBs)}
    - {system: atc, code: C09DX04, display: Sacubitril and valsartan (ARNI)}
    - {system: atc, code: C07, display: Beta blocking agents}
  flags:
    - ace_arb_plus_diuretic
    - prior_aki
    - prior_hyponatremia
  denominator_key: heart_failure
  denominator_note: Panel sizing uses the VA CHF planning estimate (~5% — planning anchor).

actions:
  care_team:
    - phase: pre_event
      text: >-
        Generate the HF roster with medication classes; flag ACE/ARB + diuretic combinations,
        CKD, age ≥65, housing instability, no-AC.
    - phase: pre_event
      text: >-
        Where the HF clinician judges it appropriate, pre-specify an individualized hot-day
        plan (weights, symptoms, when to call about diuretic dosing). There is no guideline
        rule for reducing diuretics in heat; adjustments are clinician-directed only.
    - phase: pre_event
      text: Confirm daily-weight capability (scale at home) and cooling access.
    - phase: during_event
      text: >-
        Daily-weight and symptom telemonitoring for the flagged panel; same-day
        electrolyte/renal checks for dizziness, cramps, palpitations, or oliguria;
        clinician-directed diuretic adjustments only.
  patient:
    - text: Hot days are hard on your heart.
    - text: Weigh yourself every morning.
    - text: >-
        Call us if you gain more than 2–3 pounds in a day or 5 pounds in a week — and also if
        you lose more than 2–3 pounds in a day or feel dizzy, because in the heat that can
        mean dehydration.
    - text: >-
        If a doctor has given you a fluid limit — for your heart or your kidneys — keep to
        that limit and call us so we can make a heat plan that is safe for you.
    - text: >-
        Stay in the coolest place you can, and keep taking your medicines as prescribed — call
        us before changing anything.
  caregiver: []

escalation:
  - signs: >-
      Weight gain >2–3 lb/day or >5 lb/week, or weight loss >2–3 lb/day with dizziness or low
      urine output
    response: same-day call
    emergency: false
  - signs: Chest pain, severe breathlessness, syncope
    response: "911"
    emergency: true
  - signs: No cooling at home during a warning
    response: same-day cooling placement
    emergency: false

evidence_tier: strong
evidence:
  mechanism: >-
    Diuretics deplete volume and electrolytes in heat; ACE inhibitors and ARBs can blunt
    thirst; beta-blockers limit the cardiac-output response to heat stress — CDC guidance
    flags the ACE/ARB + diuretic combination as one that may significantly increase heat risk.
  claims:
    - text: >-
        Diuretics deplete volume and electrolytes in heat; ACE inhibitors and ARBs can blunt
        thirst; beta-blockers limit the cardiac-output response to heat stress — CDC guidance
        flags the ACE/ARB + diuretic combination as one that may significantly increase heat
        risk.
      tier: strong
      source_ids: [cdc-heat-medications-2024]
    - text: >-
        Among older Medicare beneficiaries with chronic conditions, common cardiovascular
        medications were associated with 21% (7–38%) to 33% (14–55%) increases in
        heat-related hospitalization during heatwaves; drug and heatwave effects were largely
        additive.
      tier: strong
      source_ids: [layton-2020]
    - text: >-
        In a 27-country study, heat above the 99th temperature percentile was associated with
        higher heart-failure mortality than the minimum-mortality temperature, and hot days
        above the 97.5th percentile accounted for about 2.6 excess deaths per 1,000
        heart-failure deaths — the highest excess-death proportion among cardiovascular
        causes.
      tier: strong
      source_ids: [alahmad-2023]
    - text: >-
        Among California veterans with cardiometabolic disease, social factors (notably
        homelessness) amplified extreme-heat mortality risk.
      tier: inferential
      source_ids: [shannon-2025]
  caveats:
    - >-
      Daily-weight thresholds follow standard HF patient education (hf-daily-weight-education,
      URL pending).
    - The fluid-limit sentence is shared verbatim with Cards 1 and 6.

sources:
  - id: alahmad-2023
    citation: >-
      Alahmad B et al. Associations Between Extreme Temperatures and Cardiovascular
      Cause-Specific Mortality: Results From 27 Countries. Circulation 2023;147(1):35–46.
    url: https://doi.org/10.1161/CIRCULATIONAHA.122.061832
    year: 2023
  - id: layton-2020
    citation: >-
      Layton JB et al. Heatwaves, medications, and heat-related hospitalization in older
      Medicare beneficiaries with chronic conditions. PLoS One 2020;15(12):e0243665.
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7728169/
    year: 2020
  - id: cdc-heat-medications-2024
    citation: CDC "Heat and Medications — Guidance for Clinicians" (June 2024 version)
    url: https://restoredcdc.org/www.cdc.gov/heat-health/hcp/clinical-guidance/heat-and-medications-guidance-for-clinicians.html
    year: 2024
    note: Live page archived early 2025; cites the archived copy.
  - id: hf-daily-weight-education
    citation: AHA/HFSA heart-failure patient education (daily-weight call thresholds)
    note: URL pending.
  - id: shannon-2025
    citation: >-
      Shannon EM et al. Extreme Heat, Social Factors, and Mortality Among California Veterans
      With Cardiometabolic Disease. JAMA Netw Open 2025;8(11):e2545524.
    url: https://doi.org/10.1001/jamanetworkopen.2025.45524
    year: 2025
    note: Figures pending verification; the card quotes none.
  - id: va-chf-prevalence
    citation: VA heart-failure prevalence anchor (~5% of veterans in VA care)
    note: Planning estimate for panel sizing only; awaits its primary VA source.

window_days: {min: 3, max: 7}
safety:
  do_not_stop_medication: true
  notes:
    - >-
      There is no guideline rule for reducing diuretics in heat; adjustments are
      clinician-directed only.
acuity_class: heart_failure
care_system_hooks: []
