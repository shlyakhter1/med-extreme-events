# yaml-language-server: $schema=card.schema.json
# Transcribed from docs/card-library-additions.md — Card 8. Clinical strings are verbatim; do not edit in code.
id: smoke-copd-asthma
version: 1.0.0
number: 8
title: Wildfire Smoke × COPD / Asthma on Inhaled Therapies
summary: >-
  Wildfire smoke's fine particulate matter (PM2.5) triggers bronchoconstriction, airway
  inflammation, and exacerbations in asthma/COPD, and cardiovascular events in susceptible
  patients.

event_triggers:
  - type: air_pollution
    conditions:
      aqi_min: 101
  - type: wildfire_smoke
    conditions:
      smoke_density_min: Medium
      temporality: observed

population_selector:
  condition_codes:
    - {system: icd10cm, code: J45, display: Asthma}
    - {system: icd10cm, code: J44, display: Chronic obstructive pulmonary disease}
  med_classes:
    - {system: atc, code: R03AC02, display: Salbutamol (albuterol), qualifier: SABA rescue inhaler}
    - {system: atc, code: R03BA, display: Inhaled glucocorticoids (ICS)}
    - {system: atc, code: R03AK, display: Adrenergics in combination with corticosteroids (ICS/LABA)}
  flags:
    - cardiovascular_disease
    - diabetes
    - outdoor_worker
    - homeless
  denominator_key: asthma
  denominator_note: >-
    Denominators: PLACES county asthma/COPD rates × catchment veteran counts.
  sub_panels:
    - key: copd
      label: COPD
      condition_codes:
        - {system: icd10cm, code: J44, display: Chronic obstructive pulmonary disease}
      denominator_key: copd

actions:
  care_team:
    - phase: pre_event
      text: >-
        Generate the asthma/COPD roster; auto-message the smoke-forecast alert with
        action-plan reminders.
    - phase: pre_event
      text: >-
        Verify rescue-inhaler supply (push refills for anyone low); confirm controller
        adherence.
    - phase: pre_event
      text: >-
        Distribute clean-air guidance: HEPA purifier or DIY box-fan filter, AC on
        recirculate, windows closed; N95s for unavoidable outdoor time.
    - phase: pre_event
      text: >-
        Flag outdoor workers and homeless patients for respite/clean-air-shelter
        coordination; reschedule outdoor appointments and pulmonary rehab.
    - phase: during_event
      text: Monitor AQI by facility ZIP.
    - phase: during_event
      text: Telehealth-first for respiratory complaints.
    - phase: during_event
      text: Low threshold for early exacerbation treatment per action plans.
    - phase: during_event
      text: Track ED-surge signal locally.
  patient:
    - text: Wildfire smoke can set off your asthma or COPD even indoors.
    - text: >-
        Stay inside with windows closed and the AC on recirculate; use an air purifier if
        you have one.
    - text: >-
        Keep your rescue inhaler with you and make sure it isn't empty — call us now if you
        need a refill.
    - text: If you must go out, an N95 mask helps; cloth masks don't.
    - text: Follow your action plan, and don't wait to treat early symptoms.
  caregiver: []

escalation:
  - signs: >-
      Using the rescue inhaler more often than your action plan allows, or it isn't
      helping
    response: call same-day
    emergency: false
  - signs: >-
      Severe shortness of breath, can't speak full sentences, chest tightness not relieved
      by the inhaler, or blue lips
    response: 911/ED
    emergency: true
  - signs: Any cardiac symptoms (chest pain, palpitations) during smoke days
    response: urgent contact
    emergency: false

evidence_tier: strong
evidence:
  mechanism: >-
    Wildfire smoke's principal hazard is fine particulate matter (PM2.5), which penetrates
    deep into the airways and bloodstream, triggering bronchoconstriction, airway
    inflammation, and exacerbations in asthma/COPD, and cardiovascular events in
    susceptible patients (EPA/CDC wildfire-smoke guidance).
  claims:
    - text: >-
        During the June 2023 Canadian-wildfire smoke event, New York State
        asthma-associated ED visits rose 81.9% statewide on the peak day (June 7), from a
        baseline mean of ~81 to 147 visits; CDC's national analysis found asthma ED visits
        17% above expected across 19 smoke days.
      tier: strong
      source_ids: [cdc-mmwr-72-34-2023, cdc-smoke-day-asthma-2023]
    - text: >-
        July 14–20, 2026 Canadian-wildfire smoke episode: more than 100 million people in
        the US under air-quality alerts from Milwaukee to Washington DC; daily-average
        PM2.5 near 200 µg/m³ in the Baltimore–DC area on July 17 prompting Code Purple
        alerts; hourly AQI above 200 across Upper Midwest/Great Lakes monitors July 16–17,
        co-occurring with a central-US heat dome — the replay-fixture event.
      tier: strong
      source_ids: [nbc-2026-smoke, nasa-svs-5665, clarity-2026, cnn-2026-07-17]
    - text: >-
        EPA/CDC wildfire smoke guides: stay indoors with windows closed and AC on
        recirculate, HEPA/clean-room use, N95 respirators when outdoor exposure is
        unavoidable, pre-check rescue-inhaler supply, follow the written asthma/COPD action
        plan.
      tier: expert_guidance
      source_ids: [epa-wildfire-smoke-guide]
  caveats: []

sources:
  - id: cdc-mmwr-72-34-2023
    citation: CDC MMWR 72(34) 2023 (NY asthma ED surge)
    year: 2023
  - id: cdc-smoke-day-asthma-2023
    citation: CDC national smoke-day asthma analysis 2023
    year: 2023
  - id: epa-wildfire-smoke-guide
    citation: 'EPA "Wildfire Smoke: A Guide for Public Health Officials" and AirNow Fire & Smoke guidance'
  - id: nbc-2026-smoke
    citation: NBC News data desk, July 2026 Canadian-wildfire smoke episode (rcna588051)
    year: 2026
  - id: nasa-svs-5665
    citation: NASA Scientific Visualization Studio #5665
    year: 2026
  - id: clarity-2026
    citation: Clarity.io open-sensor network report, July 2026
    year: 2026
  - id: cnn-2026-07-17
    citation: CNN, 2026/07/17
    year: 2026
  - id: noaa-hms
    citation: NOAA HMS product documentation
    note: Smoke-density trigger basis.

window_days: {min: 1, max: 3}
safety:
  do_not_stop_medication: true
acuity_class: smoke_copd_asthma
care_system_hooks: [my_healthevet, clinical_contact_center, pharmacy_disaster_relief_plan, homeless_pact]
