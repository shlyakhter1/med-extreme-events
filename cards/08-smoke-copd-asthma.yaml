# are verbatim; do not edit in code. [SHARED] markers are library markup and are stripped.
id: smoke-copd-asthma
version: 1.1.0
number: 8
title: Wildfire Smoke × COPD / Asthma on Inhaled Therapies
summary: >-
  Wildfire smoke's principal hazard is PM2.5, which penetrates deep into the airways,
  triggering bronchoconstriction, airway inflammation, and exacerbations in asthma/COPD, and
  cardiovascular events in susceptible patients.

event_triggers:
  - type: air_pollution
    conditions:
      aqi_min: 101
  - type: wildfire_smoke
    conditions:
      smoke_density_min: Medium
      temporality: observed

population_selector:
  condition_codes:
    - {system: icd10cm, code: J45, display: Asthma}
    - {system: icd10cm, code: J44, display: Chronic obstructive pulmonary disease}
  med_classes:
    - {system: atc, code: R03AC02, display: Salbutamol (albuterol), qualifier: SABA rescue inhaler}
    - {system: atc, code: R03BA, display: Inhaled glucocorticoids (ICS)}
    - {system: atc, code: R03AK, display: Adrenergics in combination with corticosteroids (ICS/LABA)}
  flags:
    - cardiovascular_disease
    - diabetes
    - outdoor_worker
    - homeless
  denominator_key: asthma
  denominator_note: >-
    Denominators: PLACES county asthma/COPD rates × catchment veteran counts.
  sub_panels:
    - key: copd
      label: COPD
      condition_codes:
        - {system: icd10cm, code: J44, display: Chronic obstructive pulmonary disease}
      denominator_key: copd

actions:
  care_team:
    - phase: pre_event
      text: >-
        Asthma/COPD roster; auto-message the smoke-forecast alert with action-plan reminders.
    - phase: pre_event
      text: >-
        Verify rescue-inhaler supply (push refills for anyone low); confirm controller
        adherence.
    - phase: pre_event
      text: >-
        Distribute clean-air guidance (below); flag outdoor workers and homeless patients for
        respite/clean-air-shelter coordination; reschedule outdoor appointments and pulmonary
        rehab.
    - phase: during_event
      text: >-
        Monitor AQI by facility ZIP; telehealth-first for respiratory complaints; low
        threshold for early exacerbation treatment per the patient's written action plan;
        watch the local ED-surge signal.
  patient:
    - text: Wildfire smoke can set off your asthma or COPD even indoors.
    - text: >-
        When the air quality index is over 100, limit your time outside; over 150, stay
        inside if you can.
    - text: >-
        Keep windows closed and run the AC on recirculate, with the best filter it takes.
    - text: >-
        A well-fitted N95 helps if you must go out — cloth and surgical masks don't block
        smoke.
    - text: >-
        A box fan with a MERV-13 filter taped to it can help as a temporary fix; don't leave
        it running unattended.
    - text: >-
        Keep your rescue inhaler with you and make sure it isn't empty — call us now if you
        need a refill.
    - text: >-
        Follow your asthma or COPD action plan, and don't wait to treat early symptoms.
    - text: >-
        If the power is out: Never use a generator, grill, camp stove, or charcoal indoors or
        in a garage — even with the door open. Keep generators outside and away from windows.
        Use a battery-powered CO alarm.
    - text: If it gets too hot inside, go to a cleaner-air or cooling center.
  caregiver: []

escalation:
  - signs: >-
      Rescue inhaler needed more often than the action plan allows, or not helping
    response: same-day call
    emergency: false
  - signs: >-
      Severe shortness of breath, can't speak full sentences, chest tightness unrelieved by
      the inhaler, or blue lips
    response: 911/ED
    emergency: true
  - signs: Chest pain or palpitations on smoke days
    response: urgent contact
    emergency: false

evidence_tier: strong
evidence:
  mechanism: >-
    Wildfire smoke's principal hazard is PM2.5, which penetrates deep into the airways,
    triggering bronchoconstriction, airway inflammation, and exacerbations in asthma/COPD,
    and cardiovascular events in susceptible patients.
  claims:
    - text: >-
        Wildfire smoke's principal hazard is PM2.5, which penetrates deep into the airways,
        triggering bronchoconstriction, airway inflammation, and exacerbations in asthma/COPD,
        and cardiovascular events in susceptible patients.
      tier: expert_guidance
      source_ids: [epa-wildfire-smoke-guide]
    - text: >-
        During the June 2023 smoke event, asthma-associated ED visits in New York State
        (excluding NYC; 134 EDs) rose 81.9% on June 7 versus the June 1–5 mean.
      tier: strong
      source_ids: [meek-2023]
    - text: >-
        Nationally, asthma ED visits were 17% above expected across the 19 smoke days (AQI
        ≥101) of April–August 2023.
      tier: strong
      source_ids: [cdc-smoke-asthma-2023]
  caveats:
    - The 81.9% figure is New York State excluding NYC.
    - DIY box-fan filtration is an EPA-described temporary option, not an endorsement.
    - >-
      The keep-windows-closed advice carries the overheating escape hatch
      (medical-references.md §3.3).

sources:
  - id: meek-2023
    citation: >-
      Meek HC et al. Notes from the Field: Asthma-Associated ED Visits During a Wildfire Smoke
      Event — New York, June 2023. MMWR 2023;72(34):933–5.
    url: https://doi.org/10.15585/mmwr.mm7234a6
    year: 2023
  - id: cdc-smoke-asthma-2023
    citation: >-
      CDC. Asthma-Associated ED Visits During the Canadian Wildfire Smoke Episodes — United
      States, April–August 2023. MMWR 2023;72(34).
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10468220/
    year: 2023
  - id: epa-wildfire-smoke-guide
    citation: >-
      EPA, "Wildfire Smoke: A Guide for Public Health Officials"; AirNow Fire & Smoke guidance
    note: URLs pending.
  - id: noaa-hms
    citation: NOAA Hazard Mapping System smoke product documentation
    note: Smoke-density trigger basis.
  - id: respiratory-action-plans
    citation: GINA (asthma) / GOLD (COPD) written action-plan guidance
    note: URLs pending.

window_days: {min: 1, max: 3}
safety:
  do_not_stop_medication: true
acuity_class: smoke_copd_asthma
care_system_hooks: [my_healthevet, clinical_contact_center, pharmacy_disaster_relief_plan, homeless_pact]
