# yaml-language-server: $schema=card.schema.json
# Transcribed from docs/card-library.md (clinical review 2026-09-23) — Card 5. Clinical strings
# are verbatim; do not edit in code. [SHARED] markers are library markup and are stripped.
id: outage-insulin
version: 1.2.0
number: 5
title: Hurricane / Power Outage × Insulin-Dependent Diabetes
summary: >-
  Unopened insulin loses potency within months at 37 °C, and power outages during extreme
  weather can compromise insulin effectiveness in emergencies.

event_triggers:
  - type: hurricane_flood
    conditions:
      nws_events:
        - Hurricane Watch
        - Hurricane Warning
        - Tropical Storm Watch
        - Tropical Storm Warning
  - type: power_outage
    conditions:
      temporality: observed
      outage_pct_min: 10
      sustained_polls_min: 2

population_selector:
  condition_codes:
    - {system: icd10cm, code: E10, display: Type 1 diabetes mellitus}
    - {system: icd10cm, code: E11, display: Type 2 diabetes mellitus, qualifier: insulin-treated}
  med_classes:
    - {system: atc, code: A10A, display: Insulins and analogues}
    - {system: atc, code: A10BJ, display: Glucagon-like peptide-1 (GLP-1) analogues, qualifier: refrigeration-sensitive injectable}
  device_classes:
    - {system: local, code: insulin_pump, display: Insulin pump}
  flags:
    - pump_user
    - mail_order_refrigerated_supply
  denominator_key: diabetes
  denominator_note: Panel sizing uses the VA diabetes planning estimate (~25% — planning anchor).

actions:
  care_team:
    - phase: pre_event
      text: >-
        Insulin roster with storage method and pump/CGM flags; confirm ≥14-day supply plus
        backup pens for pump users, with written basal-bolus backup dosing.
    - phase: pre_event
      text: >-
        Push the cold-chain plan: cooler + ice packs guidance, and the FDA storage rules
        below.
    - phase: pre_event
      text: Confirm glucose meter, strips, and ketone strips on hand.
    - phase: during_event
      text: >-
        Outreach to pump users in outage counties within 24 h; telehealth-first for
        hyperglycemia; emergency fills per the VA Pharmacy Disaster Relief Plan.
  patient:
    - text: Your insulin can be ruined by heat or by freezing.
    - text: >-
        If the power goes out, keep it in a cooler with ice packs — but don't let it touch the
        ice.
    - text: >-
        Most insulin is OK out of the fridge (up to 86°F) for about 28 days — check your
        insulin's label, because some types last less.
    - text: >-
        Never use insulin that was frozen, or that looks clumpy, discolored, or cloudy when it
        should be clear.
    - text: >-
        If your pump stops working, switch to your backup pens the way we showed you; insulin
        in a pump should be replaced after 48 hours without power or cooling.
    - text: Check your sugar more often.
    - text: If it's over 240 or you feel sick, check ketones.
    - text: >-
        If your sugar stays over 300, or you have moderate or large ketones, call us right
        away.
    - text: >-
        Never use a generator, grill, camp stove, or charcoal indoors or in a garage — even
        with the door open. Keep generators outside and away from windows. Use a
        battery-powered CO alarm.
    - text: Don't skip your insulin unless a clinician tells you to.
  caregiver: []

escalation:
  - signs: >-
      Glucose persistently >300 mg/dL despite dosing, moderate/large ketones, vomiting, or
      drowsiness
    response: urgent contact / ED (DKA risk)
    emergency: true
  - signs: Insulin supply compromised with no replacement
    response: same-day pharmacy solution
    emergency: false
  - signs: CGM readings that don't match symptoms
    response: confirm by fingerstick
    emergency: false

evidence_tier: strong
evidence:
  mechanism: >-
    Unopened insulin loses potency within months at 37 °C, and power outages during extreme
    weather can compromise insulin effectiveness in emergencies. FDA emergency guidance sets
    the storage rules quoted below.
  claims:
    - text: >-
        Unopened insulin loses potency within months at 37 °C, and power outages during
        extreme weather can compromise insulin effectiveness in emergencies.
      tier: strong
      source_ids: [setoguchi-hennessy-2026]
    - text: FDA emergency guidance sets the storage rules quoted below.
      tier: strong
      source_ids: [fda-insulin-emergency]
    - text: >-
        After Katrina (n = 1,795), mean A1C rose from 7.7% to 8.3% among safety-net patients
        over the following year, while VA patients — with intact records and pharmacy
        continuity — showed no significant deterioration: system continuity buffers disaster
        impact.
      tier: strong
      source_ids: [fonseca-2009]
  caveats:
    - >-
      The 28-day/86 °F rule is the FDA emergency guidance for vials and cartridges; in-use
      times differ by product (some pens 10–14 days; some basal analogues longer) — hence
      "check your insulin's label."
    - Heat and direct sun can also affect pump tubing and CGM accuracy.

sources:
  - id: fda-insulin-emergency
    citation: >-
      FDA, "Information Regarding Insulin Storage and Switching Between Products in an
      Emergency" (content current as of 09/19/2017)
    url: https://www.fda.gov/drugs/emergency-preparedness-drugs/information-regarding-insulin-storage-and-switching-between-products-emergency
  - id: setoguchi-hennessy-2026
    citation: >-
      Setoguchi S, Hennessy S. Climate Change and Medications. Pharmacoepidemiol Drug Saf
      2026;35(8):e70437.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13427620/
    year: 2026
  - id: fonseca-2009
    citation: >-
      Fonseca VA et al. Impact of a natural disaster on diabetes. Diabetes Care
      2009;32(9):1632–8.
    url: https://pubmed.ncbi.nlm.nih.gov/19542210/
    year: 2009
  - id: ada-sick-day
    citation: ADA sick-day/hyperglycemia guidance (ketone checks above 240 mg/dL or when ill)
    note: URL pending.
  - id: va-diabetes-prevalence
    citation: VA diabetes prevalence anchor (~25% of VA patients)
    note: Planning estimate for panel sizing only; awaits its primary VA source.

window_days: {min: 3, max: 7}
safety:
  do_not_stop_medication: true
acuity_class: insulin
care_system_hooks: [pharmacy_disaster_relief_plan]
