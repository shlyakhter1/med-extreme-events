# VA population profile — the only place VA-specific facts live outside cards/*.yaml.
# Numbers are planning estimates (literature multipliers), not counts. See docs/card-library.md.
profile: va
version: 1.0.0
population_label: Veterans enrolled in VHA care

# Population scopes: VA-literature rates are shares of VHA enrollees/patients, not of all
# veterans, so they apply to veterans × share_of_veterans. PLACES rates apply to all veterans.
scopes:
  vha_users:
    share_of_veterans: 0.50
    source: VHA enrollees ≈ 9.1M (VA FY2023 reporting) / VetPop2023 veterans 18.3M (9/30/2023) ≈ 0.50
    note: Planning approximation; verify against current VHA enrollment before any real deployment.

denominators:
  bipolar:
    rate: 0.030
    scope: vha_users
    basis: share of VHA enrollees
    source: docs/card-library.md Card 1 (VHA literature multiplier)
  schizophrenia:
    rate: 0.036
    scope: vha_users
    basis: share of VHA enrollees
    source: docs/card-library.md Card 2 (VHA literature multiplier)
  clozapine_share_of_schizophrenia:
    share: true
    rate: 0.04
    basis: share of VHA schizophrenia patients on clozapine
    source: docs/card-library.md Card 3
    note: As low as ≈ 1.3% in younger cohorts.
  heart_failure:
    rate: 0.05
    scope: vha_users
    basis: share of veterans in VA care
    source: docs/card-library.md Card 4 (JAMA Network Open VA cohort; ~510,000 VHA HF patients 2016–2020)
  hfref_ace_arb_arni_share:
    share: true
    rate: 0.62
    basis: share of VA HFrEF cohort prescribed ACE/ARB/ARNI
    source: docs/card-library.md Card 4
    note: Reported range ~60–64%.
  hfref_beta_blocker_share:
    share: true
    rate: 0.62
    basis: share of VA HFrEF cohort prescribed a beta-blocker
    source: docs/card-library.md Card 4
    note: Reported range ~60–64%.
  diabetes:
    rate: 0.25
    scope: vha_users
    basis: share of VA patients
    source: docs/card-library.md Card 5 (VA Office of Health Equity; Liu et al., Prev Chronic Dis)
  dialysis:
    count: 52000
    basis: veterans on maintenance dialysis, national
    source: docs/card-library.md Card 6 (VA Office of Health Equity ESRD data, 2022)
    note: ~13,000 new kidney-failure cases/year; VA finances ~60%, mostly in community units.
  # PLACES-backed keys (county-specific; adults >= 18, general population — say so in the UI)
  copd:
    places_measure: copd
    basis: CDC PLACES county crude prevalence, adults >= 18, general population
    source: CDC PLACES 2025 county release (fixtures/reference/places_county.csv)
  asthma:
    places_measure: casthma
    basis: CDC PLACES county crude prevalence (current asthma), adults >= 18, general population
    source: CDC PLACES 2025 county release
  coronary_heart_disease:
    places_measure: chd
    basis: CDC PLACES county crude prevalence, adults >= 18, general population
    source: CDC PLACES 2025 county release
  depression:
    places_measure: depression
    basis: CDC PLACES county crude prevalence, adults >= 18, general population
    source: CDC PLACES 2025 county release
  diabetes_places:
    places_measure: diabetes
    basis: CDC PLACES county crude prevalence, adults >= 18, general population (cross-check for the VA multiplier)
    source: CDC PLACES 2025 county release
  # emPOWER-backed key (county-specific; a MEASURED count of Medicare beneficiaries, not veterans —
  # shown beside the veteran estimate with that label, never instead of it)
  empower_dme:
    empower_measure: power_dependent_dme
    basis: HHS emPOWER de-identified count of Medicare (FFS + Advantage) beneficiaries with electricity-dependent DME claims, by county
    source: HHS emPOWER public REST service (fixtures/reference/empower_county.csv; vintage in the file header)
    note: Medicare proxy, not veteran-specific; small cells (1-10) are masked to 11 upstream.

# Highest acuity first (docs/implementation-plan.md M4: dialysis > clozapine > insulin > …).
acuity_order:
  - dialysis
  - clozapine_lai_methadone
  - insulin
  - lithium
  - antipsychotic_heat
  - heart_failure
  - cold_cardio_respiratory   # Card 7; one step below heart_failure, one boost step raises it to that class
  - smoke_copd_asthma         # Card 8

# Requirements v2 §4: engine co-occurrence boost (no compound trigger grammar). Heat or cold
# items in a county with an observed outage that cleared a card's threshold and debounce move
# up `steps` acuity classes and are stamped with the outage's event key; the outage's own
# items in that county get the annotation only.
co_occurrence_boost:
  steps: 1
  pairs:
    - {primary: heat, compounding: power_outage}
    - {primary: extreme_cold, compounding: power_outage}
  note: One class per compounding outage; never below rank 0.

# Notification channels in escalation order (requirements §6).
channels:
  - my_healthevet_secure_message
  - vetext
  - clinical_contact_center

escalation_default: "Contact your care team."

# Mode A catchment: each county is assigned to its nearest anchor facility (great-circle
# distance to the county's representative point); veterans counted once, at that facility.
# A card only fires where the estimate implies at least one patient with that condition
# and medication/device class. Panels are estimates; a fraction of a patient is nobody.
min_panel_patients: 1.0

catchment:
  anchor_classifications:
    - VA Medical Center (VAMC)
    - Health Care Center (HCC)
  projection_year: 2026
  note: >-
    Anchors are stations (VAMC/HCC); clinics report their station's panel. VetPop2023 Table 9L
    county projections as of 9/30 of projection_year.

# Medication-class shares layered on a card's condition panel (docs/card-library.md).
# Cards without an entry report the whole condition panel and say so in the estimate.
panel_multipliers:
  heat-heart-failure:
    denominator_key: hfref_ace_arb_arni_share
    note: Share of VA HFrEF cohort on ACE/ARB/ARNI (~60-64%); beta-blocker share is similar and overlapping, so not multiplied.

# Sanity anchors for `make load` / tests (±tolerance).
national_anchors:
  veterans_total:
    value: 17260286
    tolerance: 0.05
    source: VetPop2023 Table 1L, living veterans on 9/30/2026 (17,260,286).
  vha_heart_failure_patients:
    value: 510000
    tolerance: 0.20
    source: docs/card-library.md Card 4 (~510,000 VHA HF patients 2016-2020).

hooks:
  pharmacy_disaster_relief_plan:
    name: VA Pharmacy Disaster Relief Plan
    description: Emergency 10-day supply at in-network retail pharmacies for maintenance medications; controlled substances via VA.
    url: https://www.va.gov/fayetteville-coastal-health-care/programs/pharmacy-disaster-relief-plan/
  nccc:
    name: VA National Clozapine Coordinating Center
    description: Registry identifying VA clozapine patients.
  otp_samhsa:
    name: OTP coordination per SAMHSA disaster guidance
    description: Pre-dispensed methadone take-homes and guest dosing.
  clinical_contact_center:
    name: VA Clinical Contact Center
    description: 24/7 clinical line used to track flagged patients during an event.
  my_healthevet:
    name: My HealtheVet
    description: Secure messaging and refill channel.
  homeless_pact:
    name: Homeless PACT teams
    description: Homeless Patient Aligned Care Teams coordinating with shelters.
  kcer_hotline:
    name: KCER hotline
    description: Kidney Community Emergency Response hotline / ESRD-network coordination.
    phone: 1-866-901-3773
  empower:
    name: HHS emPOWER
    description: ZIP-level counts of electricity-dependent Medicare beneficiaries; utility priority-restoration lists.
    url: https://empowerprogram.hhs.gov/about.html
